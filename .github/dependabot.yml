version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only minor and patch updates; major versions are upgraded by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # Astro, its checker and TypeScript move together.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
          - typescript
      fonts:
        patterns:
          - '@fontsource/*'
          - '@fontsource-variable/*'
      testing:
        patterns:
          - '@playwright/test'
          - '@axe-core/playwright'
          - '@types/node'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
